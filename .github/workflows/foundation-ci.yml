name: DevShield Foundation CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install foundation package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run committed regression tests
        run: python -m pytest -q tests/test_core.py tests/test_exposure.py tests/test_security_policy.py tests/test_postgres_store_unit.py
      - name: Check CLI
        run: |
          devshield --help
          devshield scan src --fail-on none
