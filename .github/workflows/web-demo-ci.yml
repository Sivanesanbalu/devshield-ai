name: DevShield Safe Browser Preview

on:
  pull_request:
    paths:
      - "web-demo/**"
      - ".github/workflows/web-demo-ci.yml"
  push:
    branches: [main]
    paths:
      - "web-demo/**"
      - ".github/workflows/web-demo-ci.yml"

permissions:
  contents: read

jobs:
  preview-scanner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check scanner and UI syntax
        run: npm --prefix web-demo run check
      - name: Test redacted scanner, safe fixture, and coverage handling
        run: npm --prefix web-demo test
      - name: Validate static deployment configuration
        run: node -e "JSON.parse(require('fs').readFileSync('web-demo/vercel.json','utf8'))"
