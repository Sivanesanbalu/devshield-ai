name: DevShield VS Code Extension CI

on:
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension-ci.yml"
  push:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension-ci.yml"

permissions:
  contents: read

jobs:
  vscode-extension:
    name: Validate local VS Code integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: npm --prefix vscode-extension run check
      - name: Test redacted diagnostics and path safety
        run: npm --prefix vscode-extension test
