name: DevShield Operations Console CI
on:
  push:
    branches: [main]
    paths:
      - "src/devshield/ops_store.py"
      - "src/devshield/ops_console.py"
      - "src/devshield/static/**"
      - "tests/test_ops_*.py"
      - ".github/workflows/ops-console-ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: devshield_ci
          POSTGRES_USER: devshield_ci
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U devshield_ci -d devshield_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install console and tests
        run: python -m pip install -e . "psycopg[binary]>=3.2,<4" pytest
      - name: Compile code
        run: python -m compileall -q src tests
      - name: Local HTTP security tests
        run: python -m pytest -q tests/test_ops_console_http.py tests/test_ops_restrictions_http.py tests/test_ops_users_http.py
      - name: Real PostgreSQL session and tenant tests
        env:
          DEVSHIELD_TEST_PG_DSN: postgresql://devshield_ci:test_only_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/devshield_ci
        run: python -m pytest -q tests/test_ops_store_postgres.py tests/test_restriction_postgres.py tests/test_ops_users_postgres.py
