name: DevShield Python Wheel Candidate

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/python-wheel-ci.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/python-wheel-ci.yml"

permissions:
  contents: read

jobs:
  wheel-check:
    name: Wheel install smoke / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl
      - name: Install wheel in clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/devshield-wheel-env"
          "$RUNNER_TEMP/devshield-wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/devshield-wheel-env/bin/devshield" --help
      - name: Run CLI via installed wheel using synthetic source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          printf 'print("synthetic safe source")\n' > "$RUNNER_TEMP/fixture/safe.py"
          "$RUNNER_TEMP/devshield-wheel-env/bin/devshield" scan "$RUNNER_TEMP/fixture" --fail-on high --require-complete > "$RUNNER_TEMP/scan.json"
          "$RUNNER_TEMP/devshield-wheel-env/bin/python" - "$RUNNER_TEMP/scan.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["files_scanned"] == 1
          assert report["coverage"]["skipped_files"] == 0
          assert report["findings"] == []
          print("Wheel install and CLI smoke passed")
          PY
      - name: Retain reviewed wheel for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: devshield-wheel-candidate-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error
