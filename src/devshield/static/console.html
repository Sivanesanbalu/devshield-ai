<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevShield Operations</title><link rel="stylesheet" href="/assets/console.css"></head>
<body><main class="shell"><header><strong>DevShield</strong><span>Operations Console · Pre-production</span></header>
<section id="login" class="panel"><h1>Sign in</h1><p>Use your provisioned organization account.</p>
<form id="login-form"><label>Tenant <input id="tenant" required maxlength="128" autocomplete="organization"></label>
<label>Username <input id="user" required maxlength="128" autocomplete="username"></label>
<label>Password <input id="password" type="password" required autocomplete="current-password"></label>
<button type="submit">Sign in</button></form></section>
<section id="dash" hidden><div class="heading"><div><h1>Security operations</h1><p id="identity"></p></div><button id="logout" type="button">Sign out</button></div>
<div id="metrics" class="cards"></div><section class="panel"><h2>Audit activity</h2><table><thead><tr><th>Actor</th><th>Action</th><th>UTC</th></tr></thead><tbody id="audit"></tbody></table></section></section>
<p id="notice" role="status" aria-live="polite"></p><footer>Loopback-only demo. No production restriction controls.</footer></main>
<script src="/assets/console.js" defer></script></body></html>
