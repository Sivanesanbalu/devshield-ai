[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "devshield-security"
version = "1.7.0"
description = "Local-first software exposure and release integrity scanner"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47"]
[project.scripts]
devshield = "devshield.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
